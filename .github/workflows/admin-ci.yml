# Forsati Platform - Admin CI/CD Pipeline
# خط أنابيب CI/CD للمشرف

name: Admin CI/CD

on:
  push:
    branches: [main, develop, 'feat/**']
    paths:
      - 'frontend/web/src/app/api/admin/**'
      - 'frontend/web/src/components/admin/**'
      - 'frontend/web/src/lib/admin/**'
      - 'frontend/web/src/lib/keycloak/**'
      - 'frontend/web/src/lib/audit/**'
      - 'frontend/web/src/services/admin/**'
      - 'frontend/web/e2e/admin/**'
      - 'infra/db/migrations/**'
      - 'docs/api/admin-openapi.yaml'
      - '.github/workflows/admin-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/web/src/app/api/admin/**'
      - 'frontend/web/src/components/admin/**'
      - 'frontend/web/src/lib/admin/**'
      - 'frontend/web/src/lib/keycloak/**'
      - 'frontend/web/src/lib/audit/**'
      - 'frontend/web/src/services/admin/**'
      - 'frontend/web/e2e/admin/**'
      - 'infra/db/migrations/**'
      - 'docs/api/admin-openapi.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8'

jobs:
  # ==========================================
  # Lint & Type Check
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/web

      - name: Run ESLint
        run: pnpm lint
        working-directory: frontend/web

      - name: Run TypeScript Check
        run: pnpm tsc --noEmit
        working-directory: frontend/web

  # ==========================================
  # Unit Tests
  # ==========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/web

      - name: Run Unit Tests
        run: pnpm test:unit --coverage
        working-directory: frontend/web
        env:
          CI: true

      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: frontend/web/coverage/lcov.info
          flags: admin-unit
          name: admin-unit-coverage

  # ==========================================
  # OpenAPI Validation
  # ==========================================
  openapi-validation:
    name: OpenAPI Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install OpenAPI CLI
        run: npm install -g @redocly/cli

      - name: Validate Admin OpenAPI Spec
        run: redocly lint docs/api/admin-openapi.yaml

      - name: Generate OpenAPI HTML Documentation
        run: redocly build-docs docs/api/admin-openapi.yaml -o docs/api/admin-docs.html
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'

      - name: Upload API Docs
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: admin-api-docs
          path: docs/api/admin-docs.html

  # ==========================================
  # SQL Migration Validation
  # ==========================================
  sql-validation:
    name: SQL Migration Validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: forsati_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Migrations
        run: |
          for file in infra/db/migrations/*.sql; do
            echo "Running migration: $file"
            PGPASSWORD=test psql -h localhost -U test -d forsati_test -f "$file"
          done

      - name: Verify Tables Created
        run: |
          PGPASSWORD=test psql -h localhost -U test -d forsati_test -c "
            SELECT table_name 
            FROM information_schema.tables 
            WHERE table_schema = 'public' 
            ORDER BY table_name;
          "

      - name: Verify Indexes Created
        run: |
          PGPASSWORD=test psql -h localhost -U test -d forsati_test -c "
            SELECT indexname, tablename 
            FROM pg_indexes 
            WHERE schemaname = 'public' 
            ORDER BY tablename, indexname;
          "

      - name: Verify Seed Data
        run: |
          PGPASSWORD=test psql -h localhost -U test -d forsati_test -c "
            SELECT 'feature_flags' as table_name, COUNT(*) as count FROM feature_flags
            UNION ALL
            SELECT 'quota_policies', COUNT(*) FROM quota_policies
            UNION ALL
            SELECT 'points_rules', COUNT(*) FROM points_rules
            UNION ALL
            SELECT 'platform_settings', COUNT(*) FROM platform_settings;
          "

  # ==========================================
  # Integration Tests
  # ==========================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, sql-validation]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: forsati
          POSTGRES_PASSWORD: forsati123
          POSTGRES_DB: forsati
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      keycloak:
        image: quay.io/keycloak/keycloak:23.0
        env:
          KEYCLOAK_ADMIN: admin
          KEYCLOAK_ADMIN_PASSWORD: admin
          KC_DB: dev-mem
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/health/ready || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/web

      - name: Setup Database
        run: |
          for file in infra/db/migrations/*.sql; do
            PGPASSWORD=forsati123 psql -h localhost -U forsati -d forsati -f "$file"
          done

      - name: Setup Keycloak Realm
        run: |
          # Wait for Keycloak to be ready
          sleep 30
          
          # Create realm and configure (would use kcadm or API)
          echo "Keycloak setup would run here"

      - name: Run Integration Tests
        run: pnpm test:integration
        working-directory: frontend/web
        env:
          DATABASE_URL: postgresql://forsati:forsati123@localhost:5432/forsati
          KEYCLOAK_URL: http://localhost:8080
          KEYCLOAK_REALM: forsati
          KEYCLOAK_ADMIN_CLIENT_ID: forsati-admin
          KEYCLOAK_ADMIN_CLIENT_SECRET: test-secret

  # ==========================================
  # E2E Tests
  # ==========================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend/web

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend/web

      - name: Start Docker Compose
        run: docker compose -f docker-compose.dev.yml up -d
        working-directory: .

      - name: Wait for Services
        run: |
          echo "Waiting for services to be ready..."
          sleep 60

      - name: Build Next.js
        run: pnpm build
        working-directory: frontend/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000

      - name: Run E2E Tests
        run: pnpm exec playwright test e2e/admin/ --reporter=html
        working-directory: frontend/web
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          TEST_SUPER_ADMIN_EMAIL: ${{ secrets.TEST_SUPER_ADMIN_EMAIL }}
          TEST_SUPER_ADMIN_PASSWORD: ${{ secrets.TEST_SUPER_ADMIN_PASSWORD }}

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/web/playwright-report/
          retention-days: 30

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.dev.yml down

  # ==========================================
  # Security Scan
  # ==========================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'frontend/web'
          severity: 'CRITICAL,HIGH'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # Deploy Preview (PR only)
  # ==========================================
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend/web
          scope: ${{ secrets.VERCEL_ORG_ID }}

  # ==========================================
  # Deploy Production
  # ==========================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [e2e-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://admin.forsati.sa
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: frontend/web
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Run Database Migrations
        run: |
          echo "Running production database migrations..."
          # Would use a secure migration tool here
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Notify Deployment
        uses: slackapi/slack-github-action@v1.24.0
        if: success()
        with:
          payload: |
            {
              "text": "🚀 Admin Dashboard deployed to production!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Admin Dashboard Deployment*\n• Version: ${{ github.sha }}\n• Environment: Production\n• URL: https://admin.forsati.sa"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

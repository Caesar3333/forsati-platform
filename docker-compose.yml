  #   healthcheck:
  #     test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - forsati-network

  # ===========================================
  # Redis (Cache & Queues)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: forsati-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # Typesense (Search Engine)
  # ===========================================
  typesense:
    image: typesense/typesense:0.25.2
    container_name: forsati-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-typesense_api_key}
      TYPESENSE_DATA_DIR: /data
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # Apache Tika (Document Parsing)
  # ===========================================
  tika:
    image: apache/tika:latest
    container_name: forsati-tika
    restart: unless-stopped
    ports:
      - "9998:9998"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9998/tika"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # Celery Worker (Background Jobs)
  # ===========================================
  celery-worker:
    build:
      context: ./services/ingestor
      dockerfile: Dockerfile
    container_name: forsati-celery-worker
    restart: unless-stopped
    command: celery -A tasks worker --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TIKA_URL: http://tika:9998
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: 8108
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-typesense_api_key}
    depends_on:
      - redis
      - tika
      - typesense
      - minio
    networks:
      - forsati-network

  # ===========================================
  # HumHub (Social Networking Engine)
  # ===========================================
  humhub:
    image: mriedmann/humhub:stable
    container_name: forsati-humhub
    restart: unless-stopped
    environment:
      HUMHUB_DB_HOST: postgres
      HUMHUB_DB_NAME: ${HUMHUB_DB_NAME:-humhub_db}
      HUMHUB_DB_USER: ${POSTGRES_USER:-forsati}
      HUMHUB_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      HUMHUB_AUTO_INSTALL: "true"
      HUMHUB_ADMIN_LOGIN: ${HUMHUB_ADMIN_LOGIN:-admin}
      HUMHUB_ADMIN_EMAIL: ${HUMHUB_ADMIN_EMAIL:-admin@forsati.jo}
      HUMHUB_ADMIN_PASSWORD: ${HUMHUB_ADMIN_PASSWORD:-changeme}
      HUMHUB_NAME: "Forsati Community"
      HUMHUB_EMAIL: "noreply@forsati.jo"
      HUMHUB_MAILER_SYSTEM_EMAIL_ADDRESS: "noreply@forsati.jo"
      HUMHUB_MAILER_SYSTEM_EMAIL_NAME: "Forsati"
      HUMHUB_ANONYMOUS_REGISTRATION: "false"
      # S3/MinIO Storage
      HUMHUB_FILESYSTEM_S3_BUCKET: ${MINIO_BUCKET_HUMHUB:-forsati-humhub}
      HUMHUB_FILESYSTEM_S3_ENDPOINT: http://minio:9000
      HUMHUB_FILESYSTEM_S3_KEY: ${MINIO_ROOT_USER:-minioadmin}
      HUMHUB_FILESYSTEM_S3_SECRET: ${MINIO_ROOT_PASSWORD:-minioadmin}
      HUMHUB_FILESYSTEM_S3_REGION: us-east-1
      HUMHUB_FILESYSTEM_S3_USE_PATH_STYLE: "true"
    ports:
      - "8081:80"
    volumes:
      - humhub_config:/var/www/localhost/htdocs/protected/config
      - humhub_uploads:/var/www/localhost/htdocs/uploads
      - humhub_modules:/var/www/localhost/htdocs/protected/modules
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - forsati-network

  # ===========================================
  # Rocket.Chat (Optional - Rich Messaging)

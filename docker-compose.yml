# Forsati Platform - Docker Compose Configuration
# Development Environment
# 
# Usage:
#   docker-compose up -d --build
#   docker-compose logs -f
#   docker-compose down
#
# Prerequisites:
#   - Copy .env.example to .env and fill in values
#   - OR run: scripts/setup_github_secrets.ps1 -LocalEnvOnly

version: "3.9"

services:
  # ===========================================
  # PostgreSQL Database
  # ===========================================
  postgres:
    image: postgres:16-alpine
    container_name: forsati-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forsati_db}
      POSTGRES_USER: ${POSTGRES_USER:-forsati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forsati} -d ${POSTGRES_DB:-forsati_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # MinIO (S3-Compatible Storage)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: forsati-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # Keycloak (IAM / SSO)
  # ===========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: forsati-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-forsati_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-forsati}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks:
      - forsati-network

  # ===========================================
  # Strapi (Headless CMS)
  # Using custom build for development
  # ===========================================
  strapi:
    build:
      context: ./services/strapi-app
      dockerfile: Dockerfile
    container_name: forsati-strapi
    restart: unless-stopped
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-forsati_db}
      DATABASE_USERNAME: ${POSTGRES_USER:-forsati}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      APP_KEYS: ${STRAPI_APP_KEYS:-key1,key2,key3,key4}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT:-apisalt123}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET:-adminjwt123}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT:-transfer123}
      JWT_SECRET: ${STRAPI_JWT_SECRET:-jwtsecret123}
      NODE_ENV: development
    ports:
      - "1337:1337"
    volumes:
      - strapi_data:/srv/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:1337/_health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - forsati-network

  # ===========================================
  # Ingestor Service (Resume Parser - PoC)
  # ===========================================
  ingestor:
    build:
      context: ./services/ingestor
      dockerfile: Dockerfile
    container_name: forsati-ingestor
    restart: unless-stopped
    environment:
      STRAPI_URL: http://strapi:1337
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET_RESUMES:-forsati-resumes}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:8000"
    depends_on:
      - strapi
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forsati-network

  # ===========================================
  # Elasticsearch (Search & Matching) - Optional
  # ===========================================
  # elasticsearch:

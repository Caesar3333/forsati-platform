# ===========================================
# Networks
# ===========================================
networks:
  forsati-network:
    driver: bridge

# ===========================================
# Volumes
# ===========================================
volumes:
  postgres_data:
  minio_data:
  strapi_data:
  redis_data:
  typesense_data:
  humhub_config:
  humhub_uploads:
  humhub_modules:
  # mongo_data:
  # elasticsearch_data:

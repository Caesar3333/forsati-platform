          type: string
        category:
          type: string
          enum: [core, ai, social, monetization, experimental]
        defaultValue:
          type: boolean
        active:
          type: boolean
        rolloutJson:
          type: object
          properties:
            markets:
              type: array
              items:
                type: string
            roles:
              type: array
              items:
                type: string
            percentage:
              type: integer
        dependencies:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FeatureFlagCreate:
      type: object
